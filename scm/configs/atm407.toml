# Accepted ATM407 configuration with conservative mass-flux convection.
extends = "legacy_base.toml"
[run]
mode = "full"
scheme = "mf"
sampling = "fixed"
spinup_days = 100
perturb_days = 10
fixed_sst = false
plot = false
device = "auto"
label = "atm407_plume_stop"
preserve_ensemble_shape = false
save_restarts = true
restart_from = ""
ncol = 1

[numerics]
dt = 900.0
nlevels = 20
rad_interval_steps = 8
rad_interval_microphysics_steps = 1
diag_interval_days = 10

[initial]
ps0 = 100000.0
ts_init = 290.0

[forcing]
solar_constant = 1360.0
zenith_factor = 0.25
co2 = 400.0
co2_ref = 400.0
co2_2x = 800.0

[large_scale_forcing]
enabled = false

[radiation]
scheme = "multiband_ozone_profile"

[composition]
o3_peak_sigma = 0.08
o3_width_sigma = 0.04

[radiation.longwave]
f_window = 0.15
kappa_wv = 0.15
co2_log_factor = 0.14
co2_base_tau = 1.50

[radiation.shortwave]
sw_kappa_wv = 0.01
# 0.32 is the clear-sky value: with cloud radiative effects off the surface
# albedo carries the whole planetary albedo. The often-quoted pairing of clouds
# with albedo = 0.28 was measured while the clouds-off flag was being ignored,
# so it needs re-deriving before it is trusted.
albedo = 0.32

[radiation.multiband]
lw_band_weights = [0.10, 0.25, 0.35, 0.30]
lw_band_wv_kappa = [0.00, 0.10, 0.22, 0.40]
lw_band_co2_base_tau = [0.00, 0.15, 0.65, 0.35]
# calibrated 11 Sep 2026 so a CO2 doubling gives the same instantaneous clear-sky
# forcing as RRTMG on the reference column (3.62 W/m2; it was 4.72, 30% too strong,
# see docs/column_open_problems.md). this term is
# multiplied by log(co2 / co2_ref) and the control runs at co2 = co2_ref, so it
# has no effect whatsoever on the equilibrium state -- only on the forcing.
lw_band_co2_log_factor = [0.00, 0.0145, 0.1727, 0.0859]
lw_band_trace_scale = [0.00, 0.20, 0.60, 0.20]
sw_band_weights = [0.55, 0.30, 0.15]
sw_band_wv_kappa = [0.00, 0.015, 0.00]
sw_band_o3_tau = [0.00, 0.02, 0.10]
sw_band_cloud_abs_scale = [0.10, 0.25, 0.10]

[radiation.trace_gases]
enabled = true
ch4 = 1.8
ch4_ref = 1.8
ch4_base_tau = 0.02
ch4_log_factor = 0.01
n2o = 0.332
n2o_ref = 0.332
n2o_base_tau = 0.01
n2o_log_factor = 0.01
o3_lw_tau = 0.02
o3_sw_tau = 0.03
other_ghg_tau = 0.00

[radiation.clouds]
# Cloud radiative effects are OFF in the baseline, so the reference column is
# clear-sky. The machinery works and is tuned (see cloud_sw_scattering_efficiency
# below): switching this to true, together with albedo = 0.28 above, gives a net
# cloud radiative effect near -8 W/m2, correctly negative for a low-cloud
# regime. It is left off because the cloud field is not yet good enough to build
# a reference on: fraction comes out patchy and small (0.02-0.19 against 0.3-0.6
# observed), and because every cloud here is low and warm the longwave effect is
# only about +2.5 W/m2 against +26 observed. Toggling it is a good lab
# experiment; resting the equilibrium on it is not.
enabled = false
optics = "auto"
cloud_fraction = 0.0
cloud_sw_reflectivity = 0.0
cloud_sw_tau = 0.0
cloud_lw_tau = 0.0
cloud_top_sigma = 0.65
cloud_bottom_sigma = 0.95

[radiation.diagnostics]
# gives clear-sky OLR/ASR alongside all-sky, so cloud radiative effect is a
# directly measurable quantity in the lab rather than a difference of runs.
clear_sky_fluxes = true

[cloud_microphysics]
enabled = true
cloud_autoconv_tau = 5400.0
cloud_autoconv_qc_thresh = 2.0e-4
cloud_autoconv_qc_scale = 4.0e-4
cloud_autoconv_power = 2.0
cloud_evap_tau = 3600.0
# Promoted 12 Sep 2026 from 0.95. At 0.95, condensation rained 95% of new cloud
# water out at once; at the top of the BOMEX subcloud layer, where the observed air
# sat at RH 0.96, that heated the layer 9.5 K/day and warmed the subcloud layer about
# 3 K/day (defect A in docs/column_open_problems.md). Rain now leaves through the
# microphysics instead. 400-day test: every gate passes, surface temperature within
# 0.02 K, saturated band unchanged; cloud water path rises 0.219 -> 0.335 kg/m2
# because the column now holds the condensate it used to rain out.
cloud_ls_precip_fraction = 0.0
cloud_rh_evap = 0.70
cloud_rh_min = 0.90
cloud_qc_ref = 8.0e-4
cloud_cf_qc_min = 2.0e-4
cloud_cf_rh_power = 2.0
cloud_cf_qc_power = 1.5
cloud_cf_max = 0.6
cloud_qc_max = 4.0e-3
cloud_liquid_temp = 273.15
cloud_ice_temp = 258.15
conv_cloud_efficiency = 0.0008
conv_cloud_anvil_center_sigma = 0.45
conv_cloud_anvil_width_sigma = 0.18
cloud_k_liq_sw = 15.0
cloud_k_ice_sw = 8.0
cloud_k_liq_lw = 4.0
cloud_k_ice_lw = 2.0
# Raised from 0.05. This converts cloud optical depth into reflectivity, and
# at 0.05 the clouds were optically present but reflected almost nothing: net
# cloud radiative effect came out weakly positive, where a low-cloud regime
# should cool. At 0.60 the shortwave effect is about -49 W/m2 per unit cloud
# cover, which is the right order for overcast low cloud, and the net effect
# turns negative as it should.
cloud_sw_scattering_efficiency = 0.60
cloud_sw_absorption_fraction = 0.05

[shallow_convection]
enabled = true
tau = 14400.0
top_sigma = 0.72
base_sigma = 0.90
rh_trigger = 0.78
detrain_rh = 0.85
cape_suppress = 600.0
mse_scale = 3000.0
max_dt_day = 1.5
max_dq_day = 1.5
enforce_mse_conservation = true

[mass_flux]
transport_form = "flux"
entrainment_rate = 5.0e-6
detrainment_rate = 5.0e-6
# Added 12 Sep 2026. The closure's CAPE parcel mixes at this rate; the plume keeps
# entrainment_rate above. CESM2 separates the two the same way, diluting ZM's CAPE
# parcel at about 1 per km. With one knob, the rate needed to stop deep convection
# firing in BOMEX (defect B) also moved the plume's detrainment: 0.9 K cooler, CAPE
# 566 -> 121, and the saturated band doubled. Splitting them keeps BOMEX deep rain at
# zero with the lab climate intact (surface -0.12 K, band unchanged, cloud-base mass
# flux 0.0086 -> 0.0082).
cape_entrainment_rate = 5.0e-5
plume_decay_rate = 1.5e-4
tau_cape = 21600.0
precip_efficiency = 0.80
retain_convective_condensate = false
cape_threshold = 50.0
mb_max = 1.0
max_dt_day = 20.0
max_dq_day = 20.0
condensate_retention = 0.25
condensate_fallout = 0.45
cape_timescale_mode = "fixed"
closure_mode = "cape_response"
trial_mass_flux = 0.01
minimum_cape_response = 1.0
available_mass_fraction = 0.25
source_top_sigma = 0.90
buoyancy_detrainment_weight = 0.0
tau_cape_min = 1800.0
tau_cape_max = 7200.0
tau_cape_rh_ref = 0.55
tau_cape_rh_sensitivity = 1.0
tau_cape_cape_ref = 500.0
tau_cape_cape_sensitivity = 1.0
tau_cape_ft_top_sigma = 0.30
tau_cape_ft_bottom_sigma = 0.80
cape_max_pressure_step = 2500.0
# Convective downdrafts. A draft starts in the mid troposphere and sinks,
# cooled by evaporating rain, arriving in the subcloud layer about 5 K colder
# and 2 g/kg drier than the air already there. Its effect is on moist static
# energy, not relative humidity: it lowers subcloud theta_e and takes roughly
# 15% off CAPE. Rain evaporation into the environment (mf_rain_evap_coefficient)
# is left at zero -- on its own it moistens the subcloud layer with nothing to
# balance it, and it is only worth enabling alongside a stronger sink.
downdraft_fraction = 0.4
downdraft_start_sigma = 0.60
downdraft_release_sigma = 0.90
downdraft_entrainment_pa = 1.0e-5
downdraft_detrainment_pa = 1.0e-5
downdraft_release_pa = 1.2e-4
downdraft_rain_share = 0.5

[calibration]
enabled = false
scheme = "mf"
spinup_days = 100
fixed_sst = false
batch_candidates = true
batch_size = 16
last_n = 10
equilibrium_window = 10
diag_interval_days = 10
rad_interval_steps = 8
top_n = 5
ts_threshold = 0.1
toa_threshold = 1.0
label = ""

[calibration.targets]
ts = 300.0
olr = 240.0
asr = 240.0
toa_net = 0.0
surface_net_flux = 0.0

[calibration.scales]
ts = 5.0
olr = 20.0
asr = 20.0
toa_net = 5.0
surface_net_flux = 10.0

[calibration.parameter_grid]
# albedo = [0.32, 0.34, 0.36]
# f_window = [0.15, 0.20]
# kappa_wv = [0.10, 0.15]
# co2_base_tau = [1.00, 1.50]

[params]
convection_scheme = "mass_flux"
# boundary layer mixing stops at bl_top_sigma, so a statically unstable
# interface just above it is coupled to nothing and cannot be removed. without
# this the equilibrium carried a 9 K theta_v inversion across 910/945 hPa at
# roughly four times the dry adiabatic lapse rate. see scm/dry_adjustment.py.
# trigger is a lapse rate excess over the dry adiabat in K/km, so it carries
# across vertical grids. enabled by default in code; stated here for the lab.
# Condensation uses a subgrid distribution rather than a grid-mean saturation
# adjustment, so a layer that keeps receiving moisture forms partial cloud and
# settles below saturation instead of being pinned at 100% RH. See
# scm/condensation.py. This sat at 1.0 -- pure saturation adjustment -- while
# any lower value appeared to drive the column to 223 K. That collapse was
# unintended cloud shortwave absorption, not this scheme: [radiation.clouds]
# enabled = false was being ignored whenever cloud microphysics was active. With
# that fixed, sub-saturated thresholds became usable. The current September 12
# notebook reference uses 0.90, not the older 0.95 experiment. Its provenance
# and remaining cloud-layer limitations are in notebooks/data/README.md.
condensation_rh_crit = 0.90
dry_adjustment_enabled = true
dry_adjustment_max_lapse_excess = 3.0
dry_adjustment_tau = 1800.0
ocean_depth = 50.0
wind_speed = 5.0
use_slab_ocean = true
# richardson is also the code default; stated here for the lab.
boundary_layer_scheme = "richardson"
# The surface-flux stencil is inherited from scm/configs/default.toml
# (surface_moisture_sigma_depth = 0.005). Widening it to the spans the code
# defaults to was tried and measurably regressed the column: saturated mass
# fraction 19% -> 26%, surface imbalance 0.02 -> 0.23 W/m2, and surface
# temperature drift 9x larger. The narrow stencil is kept for that reason.
# The boundary layer depth is diagnosed from a bulk Richardson criterion
# rather than read off a fixed sigma level, which is what KPP, Mellor-Yamada
# and EDMF schemes all do. With the fixed cutoff, mixing stopped at a
# prescribed height whatever the profile was doing, and the interface just
# above it was left coupled to nothing -- the dry adjustment was running at
# 35 K/day permanently to patch it. With the depth diagnosed, that falls to
# exactly zero and the adjustment goes back to being a safety net.
# bl_top_sigma is ignored while bl_diagnose_depth is true; kept for reference.
bl_diagnose_depth = true
bl_min_depth_m = 100.0
bl_max_depth_m = 1500.0
# Boundary-layer mixing strength. The code default of k_diff = 0.5 m2/s is
# 20-200x weaker than a convective marine boundary layer (10-100 m2/s). At 0.5
# the lowest 1.4 km sat upside down (theta_v fell 3.16 K from the surface to
# 865 hPa) and dry adjustment did the mixing at 14 K/day. At 40 the column is
# upright (0.39 K), dry adjustment falls to zero, and the column settles within
# 1000 days. The cap factor is raised with it so K is not clipped at 2 m2/s.
# With this change alone, equilibrium TOA was +1.06 W/m2 (+0.93 before). Mixing raised column
# water vapour 63% and warmed the column 3.6 K; those two radiative effects
# nearly cancel. Side effect: a wetter 865-910 hPa band.
k_diff = 40.0
k_diff_cap_factor = 40.0
bl_mix_moist_static_energy = true
bl_top_sigma = 0.94
include_precip_enthalpy_flux = true

# Hidden defaults, written out on 10 Sep. These are the values the code falls
# back to when a config does not set them. They were invisible, which is how
# bl_diagnose_depth = false once silently disabled a verified fix. Writing them
# here changes nothing: two physics steps are identical before and after. It
# makes every active setting visible and diffable. The [numerics] copy of
# rad_interval_microphysics_steps is not read by the physics; this one is.
bl_mix_levels = 8
bl_mix_total_water = false
bl_shear_floor = 1.0
k_diff_min = 0.05
ri_crit = 0.25
unstable_diffusion_boost = 4.0
cloud_autoconv_path_thresh_kgm2 = 0.02
cloud_autoconversion_scheme = "local"
cloud_evaporation_before_autoconversion = false
cloud_evaporation_scheme = "relative_humidity"
cloud_fraction_from_condensation = true
cloud_optical_depth_from_gridmean_water = false
cloud_sedimentation_speed = 0.0
cloud_fractional_gridmean_optics = false
cloud_fractional_optics_blend = 1.0
condensation_scheme = "large_scale"
rad_interval_microphysics_steps = 1
shallow_convection_scheme = "simple"
surface_flux_coupling = "distributed"
mf_plume_count = 1
mf_plume_entrainment_spread = 3.0
mf_rain_evap_coefficient = 0.0
#
# examples:
# tau_cape = 3600.0
# mf_mb_max = 0.05
# bm_max_dt_day = 10.0

# Optional one-layer land bucket. Defaults in code keep standalone runs
# ocean-like unless land_fraction is set above zero.
# [land_surface]
# land_fraction = 1.0
# soil_water_capacity = 0.15
# soil_moisture_initial_fraction = 0.75
# soil_wilting_fraction = 0.10
# soil_evap_critical_fraction = 0.50
# soil_field_capacity_fraction = 0.85
# soil_drainage_timescale = 2592000.0

# Optional host/dycore surface-context contract. These can be scalar or
# per-column vectors in coupled use.
# [surface_context]
# surface_type = 1
# land_fraction = 0.0
# ocean_fraction = 1.0
# sea_ice_fraction = 0.0
# glacier_fraction = 0.0
# land_use_type = 0
# soil_type = 0
# topography = 0.0
# surface_temperature = 290.0
# soil_moisture = 0.10
# soil_temperature = 285.0
# snow_water_equivalent = 0.0
# sea_ice_thickness = 0.0
# surface_albedo = 0.32
# roughness_length = 0.01
# exchange_coefficient_heat = 1.2e-3
# exchange_coefficient_moisture = 1.2e-3
# surface_emissions = 0.0

# Optional composition/chemistry contract. Radiation already consumes CO2 and
# simple trace-gas optical-depth fields; emissions/deposition are placeholders
# for future chemistry coupling diagnostics.
# [composition]
# co2_ppm = 400.0
# ch4_ppm = 1.8
# n2o_ppm = 0.332
# ozone_lw_tau = 0.02
# ozone_sw_tau = 0.03
# aerosol_optical_depth = 0.0
# surface_emissions = 0.0
# dry_deposition_velocity = 0.0
# wet_deposition_rate = 0.0

# The deep-convection plume stops at its level of neutral buoyancy, as in CESM2
# (Zhang-McFarlane). Without this it carried about 5 W/m2 of heat from the
# stratosphere into the troposphere. See docs/column_open_problems.md, 10 Sep.
# Equilibrium with it: TOA +0.46 W/m2, surface temperature 289.0 K.
# After the 12 Sep rain-out and CAPE-parcel changes above: TOA +0.75 W/m2,
# surface temperature 289.05 K, CAPE 183 J/kg, cloud water path 0.338 kg/m2.
mf_plume_stop_at_neutral_buoyancy = true
