[run]
label = "uw_candidate_v1"

[radiation]
scheme = "multiband_ozone_profile"

[radiation.diagnostics]
clear_sky_fluxes = true

[composition]
o3_peak_sigma = 0.08
o3_width_sigma = 0.04

[physics_grid]
enabled = false
sublevels = 3
top = 0.65
categories = ["boundary_layer", "shallow_convection"]

[params]
surface_flux_coupling = "boundary_layer"
boundary_layer_scheme = "uw_moist"
shallow_convection_scheme = "uw_shallow"
bl_min_depth_m = 50.0
bl_max_depth_m = 3000.0
uw_maximum_turbulent_height_m = 5000.0
uw_diffusivity_max_m2s = 200.0
uw_shallow_maximum_height_m = 4000.0
uw_shallow_vertical_step_m = 50.0
uw_shallow_mixing_efficiency = 8.0
uw_shallow_core_area_max = 0.10
uw_shallow_condensate_maximum_kgkg = 1.0e-3
uw_shallow_cloud_area_multiplier = 2.0
uw_shallow_in_cloud_condensate_kgkg = 3.0e-3
