[run]
label = "mf_saturation_evap_v9"

[radiation]
scheme = "multiband_ozone_profile"

[mass_flux]
mse_correction_top_sigma = 0.20

[composition]
o3_peak_sigma = 0.08
o3_width_sigma = 0.04

[params]
surface_flux_coupling = "boundary_layer"
bl_mix_moist_static_energy = true
bl_mix_total_water = true
bl_diagnose_depth = true
bl_min_depth_m = 100.0
bl_max_depth_m = 900.0
cloud_evaporation_scheme = "saturation_deficit"
